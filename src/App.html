<div class="bg-navy min-h-screen text-slate selection:bg-green selection:text-navy font-sans overflow-x-hidden">

    <!-- Ambient background: must stay a direct, unwrapped child here so its
         `fixed` positioning escapes to the viewport — an ancestor with
         transform/filter/will-change/contain would trap it into a local
         stacking context instead. -->
    <AmbientBackground v-if="showAmbientBackground" />

    <AppLayout>
        <template #sidebar>
            <AppSidebar :personal-info="PERSONAL_INFO" :nav-links="NAV_LINKS" :social-links="SOCIAL_LINKS"
                :active-section-id="activeSectionId" />
        </template>

        <template #topbar>
            <TheNavbar :nav-links="NAV_LINKS" :social-links="SOCIAL_LINKS" :is-mobile-menu-open="isMobileMenuOpen"
                :active-section-id="activeSectionId" @toggle-mobile-menu="toggleMobileMenu"
                @close-mobile-menu="closeMobileMenu" />
        </template>

        <template #content>
            <main class="px-6 md:px-12 lg:px-16 xl:px-20">
                <!-- Intro -->
                <IntroSection :personal-info="PERSONAL_INFO" @navigate-projects="navigateToProjects"
                    @toggle-chat="toggleChat" />

                <!-- About Section -->
                <AboutSection :core-tech-stack="CORE_TECH_STACK" :github-url="SOCIAL_LINKS.github" />

                <!-- Experience Section -->
                <ExperienceSection :jobs="JOBS" :active-tab-id="activeTabId"
                    @update:active-tab-id="activeTabId = $event" />

                <!-- How I Work Section -->
                <HowIWorkSection />

                <!-- Projects Section -->
                <ProjectsSection :projects="PROJECTS" />

                <!-- Contact Section -->
                <ContactSection :email="SOCIAL_LINKS.email" />
            </main>

            <!-- Footer -->
            <TheFooter />
        </template>
    </AppLayout>

    <!-- Chat Widget -->
    <ChatWidget ref="chatContainerRef" :is-chat-open="isChatOpen" :chat-messages="chatMessages" :user-input="userInput"
        :is-thinking="isThinking" @toggle-chat="toggleChat" @send-message="sendMessage"
        @update:user-input="userInput = $event" />

</div>
